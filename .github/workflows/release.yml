name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Verify tag and metadata agree
        id: version
        run: node scripts/verify-release.mjs
  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and regression tests
        timeout-minutes: 10
        run: npx vitest run --reporter=default --reporter=json --outputFile=.qualification/unit-tests.json
      - name: Install R for isolated integration checks
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Install native R build requirements (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libuv1-dev libcurl4-openssl-dev libssl-dev
      - name: Fresh CRAN and pak libraries and real Shiny lifecycle
        timeout-minutes: 22
        run: npx vitest run test/integration-r.test.ts --reporter=default --reporter=json --outputFile=.qualification/real-r.json
        env:
          SLR_RUN_R_INTEGRATION: '1'
      - run: npm run build
      - name: Build macOS artifacts without publishing
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Windows artifacts without publishing
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          if ($env:WIN_CSC_LINK) {
            $env:CSC_LINK = $env:WIN_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          npx electron-builder --win --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build Linux artifacts without publishing
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
      - name: Configure sandbox helper on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          test -f dist/linux-unpacked/chrome-sandbox
          test ! -L dist/linux-unpacked/chrome-sandbox
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Packaged smoke (Linux, sandbox enabled)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node scripts/smoke-packaged.mjs --auto
        env:
          SLR_SMOKE_RECEIPT: .qualification/packaged-smoke.json
      - name: Packaged smoke (Windows and macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: node scripts/smoke-packaged.mjs --auto
        env:
          SLR_SMOKE_RECEIPT: .qualification/packaged-smoke.json
      - name: Preserve qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-release-${{ matrix.os }}
          path: .qualification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
  publish-draft:
    needs: [metadata, build]
    timeout-minutes: 10
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Create draft only after every platform succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-artifacts/*)
          test "${#artifacts[@]}" -gt 0
          flags=(--verify-tag --draft --title "$RELEASE_TAG" --notes-file .github/release-draft.md)
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${artifacts[@]}" "${flags[@]}"
