<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- This rendering profile uses only the fonts bundled beside this file. -->
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <!-- R face 2 requests bold; the approved brand wordmark uses SemiBold. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrains Mono</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="weight" mode="assign"><const>demibold</const></edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
